name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (Python + C)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Refuse committed secrets
        run: |
          if git ls-files --error-unmatch config/secrets.local >/dev/null 2>&1; then
            echo "config/secrets.local must never be committed" >&2
            exit 1
          fi

      - name: Stage upstream and apply patches
        run: python tools/repeater.py prepare

      - name: Python unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Host C tests (gcc -Wall -Wextra -Werror -pedantic)
        run: python tests/host/run_host_tests.py

  firmware:
    name: Firmware (esp32, ESP-IDF v5.5.4)
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The container runs as root while the workspace belongs to the runner
      # user; without this, git refuses to operate on the submodule.
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Throwaway setup credentials
        run: python3 tools/repeater.py init-secrets

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/repeater.py build

      # The images embed the throwaway credentials and are useless to anyone
      # else, so only metadata is kept.
      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: build-info-esp32
          path: |
            build/release/esp32/build_info.json
            build/release/esp32/SHA256SUMS
