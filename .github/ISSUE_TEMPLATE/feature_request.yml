name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could it work? Note RAM/flash cost if you know it; the ESP32 is tight.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
